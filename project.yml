name: MiniCity
options:
  bundleIdPrefix: com.shuyafukai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# 広告の SDK。バナーと全画面広告に使う。
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.9.0

schemes:
  MiniCity:
    build:
      targets:
        MiniCity: all
    run:
      config: Debug
      # Xcode から動かすときだけ、買い切りの課金を手元で試せるようにする。
      storeKitConfiguration: MiniCity.storekit
    profile:
      config: Release
    archive:
      config: Release

targets:
  MiniCity:
    type: application
    platform: iOS
    sources:
      - path: MiniCity
    dependencies:
      - package: GoogleMobileAds
    info:
      path: MiniCity/Info.plist
      properties:
        GADApplicationIdentifier: ca-app-pub-9780206641404014~1923613809
        NSUserTrackingUsageDescription: 興味に合った広告を表示するために使います。許可しなくても、広告の内容が変わるだけで遊べます。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuyafukai.minicity
        PRODUCT_NAME: MiniCity
        # App Store Connect 側のバージョン表記と一致させる。
        # ASC はこの文字列でビルドを紐付けるので、"1.0" と "1.0.0" は別物になる。
        MARKETING_VERSION: "1.2.0"
        # ビルド番号は、同じアプリで一度使うと再利用できない。
        # 送り直すたびに上げる。
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ミニシティ
        # 暗号化を使っていないことを宣言しておく。
        # 入れておかないと、提出のたびに輸出コンプライアンスを手で答えることになる。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: "5.0"
        # iPhone 専用。iPad でも動くが、対応を宣言すると App Store Connect に
        # iPad のスクリーンショットも要るので、いまは出さない。
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: B54UXU8NGQ
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Game Center を使うための権利。Developer Portal 側でも
        # App ID に Game Center を有効にしておく必要がある。
        CODE_SIGN_ENTITLEMENTS: MiniCity/MiniCity.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
